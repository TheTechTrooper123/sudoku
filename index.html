<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku &ndash; Play Online for Free</title>
    <meta
      name="description"
      content="Play Sudoku online for free: four difficulty levels, pencil marks, hints and undo. No sign-up required, works on mobile and desktop."
    />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130d" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />

    <!-- Applies the system colour scheme before the first paint so that dark
         mode never flashes a white page. Kept inline and dependency-free on
         purpose. Nothing is stored. -->
    <script>
      (function () {
        var dark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <!-- Domain der live laufenden Seite – bei einem Domainwechsel anpassen
         (siehe README, Abschnitt „Domain und Rechtstexte"). -->
    <link rel="canonical" href="https://sudoku-game.ddnsfree.com/" />
    <link rel="alternate" hreflang="en" href="https://sudoku-game.ddnsfree.com/" />
    <link rel="alternate" hreflang="de" href="https://sudoku-game.ddnsfree.com/?lang=de" />
    <link rel="alternate" hreflang="x-default" href="https://sudoku-game.ddnsfree.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sudoku" />
    <meta property="og:title" content="Sudoku &ndash; Play Online for Free" />
    <meta
      property="og:description"
      content="Four difficulty levels, pencil marks, hints and undo. Free, without sign-up, on any device."
    />
    <meta property="og:url" content="https://sudoku-game.ddnsfree.com/" />
    <meta property="og:image" content="https://sudoku-game.ddnsfree.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sudoku",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "url": "https://sudoku-game.ddnsfree.com/",
        "description": "Free online Sudoku game with four difficulty levels, pencil marks, hints and undo.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "featureList": [
          "Four difficulty levels",
          "Pencil marks and auto notes",
          "Hints, undo and redo",
          "Keyboard and touch support",
          "Dark and light theme"
        ],
        "inLanguage": ["en", "de"]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#board-container" data-i18n="nav.skip">Skip to the board</a>

    <header class="site-header">
      <div class="site-header__inner">
        <nav class="site-nav" aria-label="Primary">
          <button type="button" id="nav-settings" data-i18n-attr="aria-label:nav.settings">
            <span class="nav-button__icon" aria-hidden="true"></span>
          </button>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <section class="game" id="game" aria-label="Sudoku game">
        <div class="game__board">
          <h1 class="page-title" data-i18n="content.intro.title">Sudoku</h1>

          <div id="difficulty-container"></div>

          <div class="board-frame" id="board-frame">
            <div id="board-container"></div>
            <div class="loading" id="loading-overlay">
              <span class="spinner" aria-hidden="true"></span>
              <p id="loading-label" data-i18n="loading.puzzle">Loading puzzle…</p>
            </div>
          </div>

          <div class="keypad-card" id="keypad-card">
            <div id="keypad-container"></div>
          </div>

          <div id="status-container"></div>
        </div>

        <aside class="game__panel">
          <div class="panel-card">
            <div id="controls-container"></div>
          </div>
          <div class="shortcuts-card">
            <h2 class="card__title" data-i18n="shortcuts.title">Controls</h2>
            <dl class="shortcuts">
              <div><dt><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></dt><dd data-i18n="shortcuts.move">Select a cell</dd></div>
              <div><dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd data-i18n="shortcuts.digit">Enter a number</dd></div>
              <div><dt><kbd>⌫</kbd></dt><dd data-i18n="shortcuts.erase">Clear a cell</dd></div>
              <div><dt><kbd>N</kbd></dt><dd data-i18n="shortcuts.notes">Pencil marks on/off</dd></div>
              <div><dt><kbd>Ctrl</kbd>+<kbd>Z</kbd><kbd>Y</kbd></dt><dd data-i18n="shortcuts.undoRedo">Undo / redo</dd></div>
            </dl>
          </div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <a href="/privacy" data-i18n="footer.privacy">Privacy</a>
      <a href="/imprint" data-i18n="footer.imprint">Legal notice</a>
    </footer>

    <p id="live-region" class="visually-hidden" aria-live="polite" role="status"></p>

    <noscript>
      <div class="noscript">
        <strong>JavaScript is required</strong>
        <p>
          This Sudoku game runs entirely in your browser and needs JavaScript to be enabled. /
          Dieses Sudoku-Spiel läuft vollständig im Browser und benötigt JavaScript.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
